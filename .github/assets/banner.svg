<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A05"/>
      <stop offset="100%" stop-color="#0D0705"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D45113"/>
      <stop offset="50%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#FCBF49"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D45113" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F77F00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FCBF49" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2B1710" stroke-width="1"/>
    </pattern>

    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0D0705" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0705" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <text x="150" y="145" font-family="'Courier New', monospace" font-size="28"
        fill="#F77F00" opacity="0.6">[</text>
  <text x="1030" y="145" font-family="'Courier New', monospace" font-size="28"
        fill="#FCBF49" opacity="0.6">]</text>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">VectorPro</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#C99A7A">CONFIGURABLE, HEADER-ONLY DYNAMIC ARRAY FOR C++20</text>
</svg>
