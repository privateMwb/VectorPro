name: Benchmarks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for this run (e.g. v1.1.0). Required for manual runs — leave blank to skip committing a snapshot.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake clang

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Benchmarks
        run: cmake --build build --target benchmarks

      - name: Run Benchmarks
        run: ./build/benchmarks

      - name: Build Compare
        run: cmake --build build --target compare

      - name: Run Compare
        run: ./build/compare > compare_results.txt

      - name: Build Regression
        run: cmake --build build --target regression

      - name: Run Regression
        run: ./build/regression > regression_results.txt

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Benchmark Snapshot
        if: steps.version.outputs.version != ''
        run: |
          cp benchmark_results.json "benchmarks/baselines/${{ steps.version.outputs.version }}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "benchmarks/results/${{ steps.version.outputs.version }}.json"
          git diff --staged --quiet || git commit -m "benchmarks: add results for ${{ steps.version.outputs.version }}"
          git push

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

      - name: Upload Compare Results
        uses: actions/upload-artifact@v4
        with:
          name: compare-results
          path: compare_results.txt

      - name: Upload Regression Results
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: regression_results.txt
